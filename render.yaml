# Render.com Blueprint
# https://render.com/docs/blueprint-spec

services:
  # Single service: Backend API + Frontend SPA
  - type: web
    name: kidbot-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: DEEPSEEK_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SENTENCE_TRANSFORMERS_HOME
        value: "/opt/render/.cache/sentence_transformers"
    healthCheckPath: /api/status
    autoDeploy: true
